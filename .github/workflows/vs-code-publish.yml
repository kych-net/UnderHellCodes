name: vs-code 插件发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- 编译 + 打包 vsix,随 tag 上传到 GitHub Release ----------
  package:
    name: 编译并打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vs-code/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: vs-code

      - name: 编译 + 打包
        run: npm run package
        working-directory: vs-code

      - name: 上传到 Release (tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          file=$(ls *.vsix)
          gh release upload "${GITHUB_REF_NAME}" "$file" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物 (供手动/后续使用)
        uses: actions/upload-artifact@v4
        with:
          name: underhell-elements
          path: vs-code/*.vsix
          if-no-files-found: error

  # ---------- 发布到 VS Code 市场 (需配置 VSCE_PAT,否则跳过) ----------
  publish-marketplace:
    name: 发布到 VS Code 市场
    if: startsWith(github.ref, 'refs/tags/') && env.VSCE_PAT_AVAILABLE == 'true'
    env:
      VSCE_PAT_AVAILABLE: ${{ secrets.VSCE_PAT != '' }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vs-code/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: vs-code

      - name: 发布
        run: npx @vscode/vsce publish -p "$VSCE_PAT"
        working-directory: vs-code
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}